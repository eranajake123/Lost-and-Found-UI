<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostandFound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        actBlue: "#0057A8",
                        actDark: "#003B73",
                        actYellow: "#FFC72C"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-actBlue text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <div class="flex flex-wrap items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-actYellow text-actDark font-bold px-3 py-2 rounded-md shadow-sm">
                        ACT
                    </div>
                    <h1 class="text-xl font-bold tracking-tight">
                        Lost & Found
                    </h1>
                </div>

                <a href="#report"
                   class="bg-actYellow text-actDark px-4 py-2 rounded-lg font-semibold hover:bg-yellow-400 transition shadow-sm">
                    Submit Report
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-grow">

        <!-- TITLE -->
        <section class="max-w-5xl mx-auto px-6 py-12">
            <div class="text-center">
                <h2 class="text-3xl md:text-4xl font-bold text-actDark">
                    ACT Lost and Found
                </h2>
                <p class="text-gray-500 mt-2">
                    What are you looking for?
                </p>
            </div>

            <!-- LOST & FOUND BUTTONS -->
            <div class="rounded-xl p-6 sm:p-10 grid md:grid-cols-2 gap-6 max-w-2xl mx-auto mt-8">
                <!-- LOST ITEM BUTTON -->
                <button
                    type="button"
                    onclick="document.getElementById('reportType').value='Lost Item'; document.getElementById('report').scrollIntoView({behavior:'smooth'});"
                    class="bg-white border-2 border-actBlue rounded-xl p-8 text-actBlue hover:bg-actBlue hover:text-white transition duration-200 shadow-sm hover:shadow-lg text-center">
                    <div class="text-5xl mb-3">🔍</div>
                    <h3 class="text-2xl font-bold">Lost Item</h3>
                </button>

                <!-- FOUND ITEM BUTTON -->
                <button
                    type="button"
                    onclick="document.getElementById('reportType').value='Found Item'; document.getElementById('report').scrollIntoView({behavior:'smooth'});"
                    class="bg-white border-2 border-actYellow rounded-xl p-8 text-yellow-700 hover:bg-actYellow hover:text-actDark transition duration-200 shadow-sm hover:shadow-lg text-center">
                    <div class="text-5xl mb-3">📦</div>
                    <h3 class="text-2xl font-bold">Found Item</h3>
                </button>
            </div>
        </section>

        <!-- DASHBOARD & ITEMS LIST -->
        <section class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

            <!-- STATS COUNTER BAR -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Total Reports</p>
                    <p id="stat-total" class="text-2xl font-bold text-actDark mt-1">0</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Active Lost</p>
                    <p id="stat-lost" class="text-2xl font-bold text-red-600 mt-1">0</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Active Found</p>
                    <p id="stat-found" class="text-2xl font-bold text-blue-600 mt-1">0</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 text-center">
                    <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Resolved</p>
                    <p id="stat-resolved" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
                </div>
            </div>

            <!-- SEARCH AND FILTER CONTROLS -->
            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm border border-gray-200 mb-8 space-y-4">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                    
                    <!-- Search Input -->
                    <div class="relative w-full md:w-1/2">
                        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" 
                               id="searchInput" 
                               oninput="filterItems()" 
                               placeholder="Search items by title, location, description..." 
                               class="w-full pl-11 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-actBlue focus:bg-white transition">
                    </div>

                    <!-- Category Filter -->
                    <div class="w-full md:w-auto flex items-center gap-2">
                        <label for="categoryFilter" class="text-xs font-bold text-gray-500 uppercase whitespace-nowrap">Category:</label>
                        <select id="categoryFilter" 
                                onchange="filterItems()" 
                                class="w-full md:w-auto border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-actBlue">
                            <option value="All">All Categories</option>
                            <option value="Electronics">Electronics</option>
                            <option value="ID/Cards">ID & Cards</option>
                            <option value="Keys">Keys</option>
                            <option value="Clothing">Clothing & Apparel</option>
                            <option value="Books">Books & Notebooks</option>
                            <option value="Accessories">Accessories & Bags</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Status Filter Tabs -->
                <div class="flex border-b border-gray-200 overflow-x-auto pt-2 gap-2 text-sm font-medium">
                    <button onclick="setFilterTab('All')" id="tab-All" class="filter-tab pb-2 px-3 border-b-2 border-actBlue text-actBlue font-bold whitespace-nowrap">
                        All Reports
                    </button>
                    <button onclick="setFilterTab('Lost Item')" id="tab-Lost" class="filter-tab pb-2 px-3 border-b-2 border-transparent text-gray-500 hover:text-actBlue whitespace-nowrap">
                        🔍 Lost Items
                    </button>
                    <button onclick="setFilterTab('Found Item')" id="tab-Found" class="filter-tab pb-2 px-3 border-b-2 border-transparent text-gray-500 hover:text-actBlue whitespace-nowrap">
                        📦 Found Items
                    </button>
                    <button onclick="setFilterTab('Resolved')" id="tab-Resolved" class="filter-tab pb-2 px-3 border-b-2 border-transparent text-gray-500 hover:text-actBlue whitespace-nowrap">
                        ✅ Resolved / Claimed
                    </button>
                </div>
            </div>

            <!-- ITEMS GRID CONTAINER -->
            <div id="itemsContainer" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Items dynamically rendered here -->
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-gray-300 my-6">
                <div class="text-5xl text-gray-300 mb-3">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-700">No Items Found</h3>
                <p class="text-sm text-gray-500 max-w-sm mx-auto mt-1">Try adjusting your search terms or filters, or be the first to submit a new report!</p>
            </div>

        </section>

        <!-- REPORT FORM -->
        <section id="report" class="bg-white py-12 border-t border-gray-200">
            <div class="max-w-xl mx-auto px-6">
                <h2 class="text-2xl font-bold text-actDark text-center mb-6">
                    Submit Report
                </h2>

                <form id="reportForm" onsubmit="handleFormSubmit(event)" class="bg-gray-50 border rounded-xl p-6 space-y-5 shadow-sm">

                    <!-- TYPE -->
                    <div>
                        <label class="block font-semibold mb-2 text-sm text-gray-700">Type *</label>
                        <select id="reportType" name="reportType" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                            <option value="Lost Item">Lost Item</option>
                            <option value="Found Item">Found Item</option>
                        </select>
                    </div>

                    <!-- ITEM NAME -->
                    <div>
                        <label for="item" class="block font-semibold mb-2 text-sm text-gray-700">Item Name *</label>
                        <input id="item" name="item" type="text" placeholder="e.g. Wallet, Student ID" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>

                    <!-- CATEGORY -->
                    <div>
                        <label for="itemCategory" class="block font-semibold text-gray-700 text-sm mb-2">Category *</label>
                        <select id="itemCategory" name="itemCategory" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                            <option value="" disabled selected>Select category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="ID/Cards">ID & Cards</option>
                            <option value="Keys">Keys</option>
                            <option value="Clothing">Clothing & Apparel</option>
                            <option value="Books">Books & Notebooks</option>
                            <option value="Accessories">Accessories & Bags</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- LOCATION -->
                    <div>
                        <label for="itemLocation" class="block font-semibold mb-2 text-sm text-gray-700">Location *</label>
                        <input id="itemLocation" name="itemLocation" type="text" placeholder="e.g. Library 2nd Floor, Main Canteen" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>

                    <!-- REPORTER NAME -->
                    <div>
                        <label for="reporterName" class="block font-semibold mb-2 text-sm text-gray-700">Reporter's Full Name *</label>
                        <input id="reporterName" name="reporterName" type="text" placeholder="Your full name" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>

                    <!-- CONTACT -->
                    <div>
                        <label for="contactInfo" class="block font-semibold mb-2 text-sm text-gray-700">Contact Email or Phone *</label>
                        <input id="contactInfo" name="contactInfo" type="text" placeholder="Email or phone number" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>

                    <!-- DESCRIPTION -->
                    <div>
                        <label for="itemDescription" class="block font-semibold mb-2 text-sm text-gray-700">Other Description</label>
                        <textarea id="itemDescription" name="itemDescription" rows="3" placeholder="Describe colors, brands, distinguishing marks, stickers, or contents..." class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white"></textarea>
                    </div>

                    <!-- DATE -->
                    <div>
                        <label for="itemDate" class="block font-semibold mb-2 text-sm text-gray-700">Date *</label>
                        <input id="itemDate" name="itemDate" type="date" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>
                    <!-- TIME -->
                    <div>
                        <label for="itemTime" class="block font-semibold mb-2 text-sm text-gray-700">Time Lost/Found *</label>
                        <input id="itemTime" name="itemTime" type="time" required class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-actBlue bg-white">
                    </div>

                    <!-- IMAGE UPLOAD -->
                    <div>
                        <label class="block font-semibold text-gray-700 text-sm mb-2">Item Photo (Optional, max 2MB)</label>
                        <input id="imageUpload" type="file" accept="image/*" onchange="previewImage(event)" class="w-full text-sm text-gray-500 border border-gray-300 rounded-lg p-2 bg-white">
                        <div id="previewContainer" class="hidden mt-3 text-center">
                            <img id="imagePreview" src="" class="h-32 mx-auto rounded-lg object-cover border">
                        </div>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="w-full bg-actBlue text-white font-bold py-3 rounded-xl hover:bg-actDark transition shadow-md">
                        Submit Report
                    </button>

                </form>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-actDark text-white text-center py-5">
        <p class="text-sm">ACT Lost & Found System</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentTab = 'All';
        let currentImageBase64 = '';

        // Initial setup on window load
        document.addEventListener('DOMContentLoaded', () => {
            // Set today's date as default
            document.getElementById('itemDate').value = new Date().toISOString().split('T')[0];

            // Load initial sample items if localStorage is empty
            if (!localStorage.getItem('act_lost_found_db')) {
                const initialSamples = [
                    {
                        id: Date.now() - 20000,
                        type: 'Lost Item',
                        name: 'Wireless Earbuds',
                        category: 'Electronics',
                        location: 'Library Quiet Zone',
                        reporter: 'John Doe',
                        contact: 'john@act.edu',
                        description: 'Black case with a small scratch on the front.',
                        date: '2026-03-28',
                        status: 'Open',
                        image: ''
                    },
                    {
                        id: Date.now() - 10000,
                        type: 'Found Item',
                        name: 'Student ID Card',
                        category: 'ID/Cards',
                        location: 'Main Gate Security Office',
                        reporter: 'Security Staff',
                        contact: 'security@act.edu',
                        description: 'Found on the floor near the entrance turnstiles.',
                        date: '2026-03-29',
                        status: 'Open',
                        image: ''
                    }
                ];
                localStorage.setItem('act_lost_found_db', JSON.stringify(initialSamples));
            }

            renderItems ();
        });

        // Convert uploaded photo to Base64
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Image is too large! Please select a JPG or PNG file under 2MB.");
                    event.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = currentImageBase64;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // Handle report submission
        function handleFormSubmit(e) {
            e.preventDefault();

            const newReport = {
                id: Date.now(),
                type: document.getElementById('reportType').value,
                name: document.getElementById('item').value.trim(),
                category: document.getElementById('itemCategory').value,
                location: document.getElementById('itemLocation').value.trim(),
                reporter: document.getElementById('reporterName').value.trim(),
                contact: document.getElementById('contactInfo').value.trim(),
                description: document.getElementById('itemDescription').value.trim(),
                date: document.getElementById('itemDate').value,
                time: document.getElementById('itemTime').value,
                status: 'Open',
                image: currentImageBase64
            };

            const items = JSON.parse(localStorage.getItem('act_lost_found_db') || '[]');
            items.unshift(newReport);
            localStorage.setItem('act_lost_found_db', JSON.stringify(items));

            // Reset form inputs & preview
            document.getElementById('reportForm').reset();
            document.getElementById('previewContainer').classList.add('hidden');
            currentImageBase64 = '';
            document.getElementById('itemDate').value = new Date().toISOString().split('T')[0];

            renderItems();
            
            // Scroll to top of list
            document.getElementById('itemsContainer').scrollIntoView({ behavior: 'smooth' });
            alert("Report submitted successfully!");
        }

        // Handle Tab Switching
        function setFilterTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('border-actBlue', 'text-actBlue', 'font-bold');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            
            const tabId = tab === 'Lost Item' ? 'tab-Lost' : tab === 'Found Item' ? 'tab-Found' : `tab-${tab}`;
            const activeBtn = document.getElementById(tabId);
            if (activeBtn) {
                activeBtn.classList.add('border-actBlue', 'text-actBlue', 'font-bold');
                activeBtn.classList.remove('border-transparent', 'text-gray-500');
            }

            renderItems();
        }

        // Toggle Status (Open <-> Resolved)
        function toggleStatus(id) {
            const items = JSON.parse(localStorage.getItem('act_lost_found_db') || '[]');
            const targetItem = items.find(i => i.id === id);
            if (targetItem) {
                targetItem.status = targetItem.status === 'Open' ? 'Resolved' : 'Open';
                localStorage.setItem('act_lost_found_db', JSON.stringify(items));
                renderItems();
            }
        }

        // Delete Report
        function deleteItem(id) {
            if (confirm("Are you sure you want to delete this report?")) {
                let items = JSON.parse(localStorage.getItem('act_lost_found_db') || '[]');
                items = items.filter(i => i.id !== id);
                localStorage.setItem('act_lost_found_db', JSON.stringify(items));
                renderItems();
            }
        }

//// Render Cards and Update Stats Counters
        function renderItems() {
            const items = JSON.parse(localStorage.getItem('act_lost_found_db') || '[]');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;

            // Stats
            document.getElementById('stat-total').innerText = items.length;
            document.getElementById('stat-lost').innerText = items.filter(i => i.type === 'Lost Item' && i.status === 'Open').length;
            document.getElementById('stat-found').innerText = items.filter(i => i.type === 'Found Item' && i.status === 'Open').length;
            document.getElementById('stat-resolved').innerText = items.filter(i => i.status === 'Resolved').length;

            // Filter Logic
            const filteredItems = items.filter(i => {
                const matchesTab = currentTab === 'All' ? true :
                                   currentTab === 'Resolved' ? i.status === 'Resolved' :
                                   i.type === currentTab && i.status === 'Open';

                const matchesCategory = selectedCategory === 'All' || i.category === selectedCategory;

                const formattedTime = formatTime12(i.time || '').toLowerCase();
                const matchesSearch = i.name.toLowerCase().includes(searchKeyword) ||
                                      i.location.toLowerCase().includes(searchKeyword) ||
                                      i.description.toLowerCase().includes(searchKeyword) ||
                                      i.date.includes(searchKeyword) ||
                                      formattedTime.includes(searchKeyword);

                return matchesTab && matchesCategory && matchesSearch;
            });

            const container = document.getElementById('itemsContainer');
            const emptyState = document.getElementById('emptyState');

            if (filteredItems.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filteredItems.map(item => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition">
                    ${item.image ? `<img src="${item.image}" onclick="openImageModal('${item.image}')" class="w-full h-48 object-cover border-b cursor-pointer hover:opacity-90 transition" title="Click to view fullscreen">` : ''}
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="px-2.5 py-1 text-xs font-bold rounded-md ${
                                    item.status === 'Resolved' ? 'bg-gray-100 text-gray-700' :
                                    item.type === 'Lost Item' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                                }">
                                    ${item.status === 'Resolved' ? '✅ Resolved' : item.type}
                                </span>
                                
                                <!-- CHANGED PART: Renders both Date and Time -->
                                <div class="text-right">
                                    <span class="text-xs text-gray-500 font-medium block">📅 ${item.date}</span>
                                    ${item.time ? `<span class="text-xs text-gray-400 block font-mono">🕒 ${formatTime12(item.time)}</span>` : ''}
                                </div>
                            </div>

                            <h3 class="text-lg font-bold text-gray-800">${escapeHtml(item.name)}</h3>
                            <p class="text-xs font-semibold text-actBlue mt-0.5">${escapeHtml(item.category)}</p>

                            <p class="text-sm text-gray-600 mt-2">
                                <i class="fa-solid fa-location-dot text-red-500 mr-1"></i> ${escapeHtml(item.location)}
                            </p>

                            ${item.description ? `<p class="text-xs text-gray-500 mt-2 bg-gray-50 p-2 rounded border">${escapeHtml(item.description)}</p>` : ''}

                            <div class="mt-4 pt-3 border-t text-xs text-gray-500 space-y-1">
                                <p><strong>Reported by:</strong> ${escapeHtml(item.reporter)}</p>
                                <p><strong>Contact:</strong> ${escapeHtml(item.contact)}</p>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-4 pt-3 border-t">
                            <button onclick="toggleStatus(${item.id})" class="flex-1 text-xs py-2 px-3 rounded-lg border font-semibold transition ${
                                item.status === 'Open' ? 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                            }">
                                ${item.status === 'Open' ? 'Mark Resolved' : 'Reopen'}
                            </button>
                            <button onclick="deleteItem(${item.id})" class="text-xs py-2 px-3 text-red-600 hover:bg-red-50 border border-red-200 rounded-lg transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterItems() {
            renderItems();
            }
            function formatTime12(time24) {
        if (!time24) return '';
        const [h, m] = time24.split(':');
        let hours = parseInt(h, 10);
        const suffix = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${hours}:${m} ${suffix}`;
    }
        // Functions to open/close Fullscreen Image View
        function openImageModal(imageSrc) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        // Helper function to prevent HTML injection attacks
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }
    </script>
    <!-- FULLSCREEN IMAGE MODAL -->
<div id="imageModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onclick="closeImageModal()">
    <div class="relative max-w-4xl max-h-full">
        <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-gray-300">&times;</button>
        <img id="modalImage" src="" class="max-w-full max-h-[85vh] rounded-lg object-contain shadow-2xl">
    </div>
</div>

</body>
</html>
